[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "auditalgpd"
version = "0.1.0"
description = "Diagnóstico técnico preliminar de sinais de privacidade em páginas web"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "beautifulsoup4>=4.13,<5",
    "reportlab>=4.4,<5",
]

[tool.setuptools.packages.find]
include = ["auditalgpd*"]

[tool.setuptools.package-data]
auditalgpd = ["templates/*.html", "static/*.css", "static/*.js"]
