<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AuditaLGPD{% endblock %} · Diagnóstico de privacidade</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <script defer src="{{ url_for('static', filename='app.js') }}"></script>
</head>
<body>
  <a class="skip" href="#conteudo">Ir para o conteúdo</a>
  <header class="topbar"><div class="nav-wrap">
    <a class="brand" href="{{ url_for('web.home') }}"><span class="brand-icon" aria-hidden="true">A</span> Audita<span>LGPD</span></a>
    <nav aria-label="Navegação principal"><a href="{{ url_for('web.home') }}">Nova auditoria</a><a href="{{ url_for('web.history') }}">Histórico</a><span class="version">MVP 0.1</span></nav>
  </div></header>
  <main id="conteudo" class="container">{% block content %}{% endblock %}</main>
  <footer class="footer"><span>AuditaLGPD <span aria-hidden="true">/</span> Projeto acadêmico</span><span>Diagnóstico técnico preliminar. Exige interpretação humana.</span></footer>
</body>
</html>
